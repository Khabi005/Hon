name: hon
description: "Hon — A quiet, elegant reading app for novels, EPUBs, and PDFs."
publish_to: 'none'
version: 1.1.2+4

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  path_provider: ^2.1.5
  path: ^1.9.1
  shared_preferences: ^2.3.5
  archive: ^3.6.1
  xml: ^6.5.0
  html: ^0.15.5
  file_picker: ^8.1.7
  intl: ^0.20.2
  crypto: ^3.0.6
  uuid: ^4.5.1
  pdfx: ^2.6.0
  http: ^1.3.0
  lua_dardo_plus: ^0.3.1
  drift: ^2.34.4
  sqlite3: ^3.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.15.1

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/fixtures/
    - assets/sources/
    - assets/sources/bundled/
    - assets/legal/
  fonts:
    - family: Newsreader
      fonts:
        - asset: assets/fonts/newsreader-Regular.ttf
        - asset: assets/fonts/newsreader-Italic.ttf
          style: italic
    - family: Literata
      fonts:
        - asset: assets/fonts/literata-Regular.ttf
        - asset: assets/fonts/literata-Italic.ttf
          style: italic
    - family: Lora
      fonts:
        - asset: assets/fonts/lora-Regular.ttf
        - asset: assets/fonts/lora-Italic.ttf
          style: italic
    - family: Libre Baskerville
      fonts:
        - asset: assets/fonts/librebaskerville-Regular.ttf
        - asset: assets/fonts/librebaskerville-Italic.ttf
          style: italic
